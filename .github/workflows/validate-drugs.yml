name: Validate drug data

on:
  push:
    paths:
      - "drugs.json"
      - "drugs.schema.json"
      - "scripts/validate-drugs.mjs"
  pull_request:
    paths:
      - "drugs.json"
      - "drugs.schema.json"
      - "scripts/validate-drugs.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-drugs.mjs
