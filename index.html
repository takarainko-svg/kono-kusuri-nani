<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22577a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="この薬、なに？">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>この薬、なに？｜ケアマネ向け薬剤メモ</title>
<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#667085;
    --line:#e6e9ef;
    --primary:#22577a;
    --primary-soft:#eaf4fb;
    --warn:#9a5b00;
    --warn-soft:#fff6df;
    --care:#246b4a;
    --care-soft:#eaf7ef;
    --danger:#9b2c2c;
    --danger-soft:#fff0f0;
    --shadow:0 7px 24px rgba(29,45,68,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    line-height:1.65;
  }
  .app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:38px}
  header{
    padding:18px 18px 10px;
    background:rgba(246,248,251,.96);
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(230,233,239,.8);
  }
  .eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  h1{font-size:24px;margin:2px 0 10px;letter-spacing:-.02em}
  .search-wrap{position:relative}
  .search{
    width:100%;
    border:1px solid #cfd6e1;
    background:#fff;
    border-radius:15px;
    padding:15px 46px 15px 44px;
    font-size:16px;
    outline:none;
    box-shadow:0 2px 8px rgba(25,39,59,.04);
  }
  .search:focus{border-color:#7ca8c7;box-shadow:0 0 0 3px rgba(34,87,122,.08)}
  .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:19px;color:#667085}
  .clear{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    border:0;background:#eef1f5;color:#667085;width:30px;height:30px;border-radius:50%;
    font-size:16px;display:none;cursor:pointer;
  }
  main{padding:14px 16px}
  .hint{font-size:13px;color:var(--muted);margin:4px 2px 12px}
  .chips{display:flex;gap:8px;overflow:auto;padding:0 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;border:1px solid #d9dee7;background:#fff;border-radius:999px;
    padding:8px 12px;font-size:13px;color:#394150;cursor:pointer;
  }
  .result-list{display:grid;gap:9px;margin-top:4px}
  .result-item{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
    display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;
  }
  .result-item strong{font-size:15px}
  .result-item small{display:block;color:var(--muted);margin-top:2px}
  .arrow{color:#98a2b3;font-size:20px}
  .empty{
    text-align:center;background:#fff;border:1px dashed #cfd6e1;border-radius:16px;
    padding:28px 18px;color:var(--muted);margin-top:8px;
  }
  .drug-head{
    background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;
    box-shadow:var(--shadow);margin-bottom:12px;
  }
  .drug-name{font-size:25px;font-weight:800;line-height:1.3;margin:0 0 3px}
  .generic{color:var(--muted);font-size:13px}
  .tag{
    display:inline-flex;margin-top:10px;background:var(--primary-soft);color:var(--primary);
    border-radius:999px;padding:5px 10px;font-weight:700;font-size:12px;
  }
  .priority-grid{display:grid;gap:11px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;
    box-shadow:0 3px 13px rgba(29,45,68,.035);
  }
  .card.primary{border-left:5px solid var(--primary);background:linear-gradient(180deg,#fff,#fbfdff)}
  .card.warn{border-left:5px solid #d18a16;background:linear-gradient(180deg,#fff,#fffdf8)}
  .card.care{border-left:5px solid var(--care);background:linear-gradient(180deg,#fff,#fbfffc)}
  .num{
    display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;
    background:#eef2f6;color:#475467;font-size:13px;font-weight:800;margin-right:8px;
  }
  .card h2{font-size:16px;margin:0 0 9px;display:flex;align-items:center}
  .card p{margin:0;font-size:15px}
  ul{margin:8px 0 0;padding-left:1.25em}
  li{margin:5px 0}
  .important-note{
    margin-top:12px;background:var(--danger-soft);border:1px solid #f4cdcd;
    color:#7d2525;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:650;
  }
  .secondary{margin-top:12px;display:grid;gap:10px}
  details{
    background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 15px;
  }
  summary{
    list-style:none;cursor:pointer;padding:15px 0;font-weight:750;font-size:15px;
    display:flex;align-items:center;justify-content:space-between;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"＋";font-size:20px;color:#667085;font-weight:400}
  details[open] summary::after{content:"－"}
  .detail-body{padding:0 0 15px;font-size:14px;color:#344054}
  .source{
    margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;
  }
  .source-title{font-weight:750;font-size:14px}
  .source p{font-size:12px;color:var(--muted);margin:4px 0 10px}
  .source a{
    display:block;text-decoration:none;text-align:center;background:#f2f6f9;color:var(--primary);
    border-radius:11px;padding:10px;font-size:14px;font-weight:750;
  }
  .disclaimer{
    margin-top:14px;padding:14px;border-radius:14px;background:#f0f2f5;color:#5f6672;
    font-size:11.5px;line-height:1.6;
  }
  .back{
    border:0;background:transparent;color:var(--primary);padding:2px 0 12px;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .section-title{font-size:13px;color:#667085;font-weight:750;margin:3px 2px 9px}
  .foot-note{text-align:center;color:#98a2b3;font-size:11px;margin:18px 0 0}
  @media (min-width:680px){
    header{padding-left:24px;padding-right:24px}
    main{padding-left:24px;padding-right:24px}
    .priority-grid{grid-template-columns:1fr 1fr}
    .card.care{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">ケアマネ向け・薬剤クイックメモ（試作版）</div>
    <h1>この薬、なに？</h1>
    <div class="search-wrap">
      <span class="icon">⌕</span>
      <input id="search" class="search" type="search" placeholder="薬の名前を入力（例：アムロジピン）" autocomplete="off">
      <button id="clear" class="clear" aria-label="検索をクリア">×</button>
    </div>
  </header>

  <main id="main"></main>
</div>

<script>
const drugs = [
  {
    id:"amlodipine",
    name:"アムロジピン",
    generic:"アムロジピンベシル酸塩",
    aliases:["アムロジピン","ノルバスク","アムロジン","amlodipine"],
    className:"持続性Ca拮抗薬（降圧薬）",
    what:"血管を広げて血圧を下げる薬です。狭心症では心臓への血流を改善する目的でも使われます。",
    use:["高血圧症","狭心症"],
    common:["足などのむくみ","ほてり・顔の赤み","動悸","血圧低下","めまい・ふらつき","頭痛"],

    care:["新たなふらつき、立ちくらみ、転倒がないか","足のむくみが増えていないか","血圧が以前より大きく下がっていないか","脈が極端に遅い、失神するなどの変化がないか","筋肉痛・強い脱力、黄疸など普段と違う症状がないか"],
    updated:"2026年6月改訂版を参照",
    source:"https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/2171022F1134_1?user=1"
  },
  {
    id:"furosemide",

    generic:"フロセミド",
    aliases:["フロセミド","ラシックス","furosemide"],
    className:"ループ利尿薬",
    what:"尿を出して体内の余分な水分や塩分を減らす薬です。むくみを改善し、血圧を下げる目的でも使われます。",
    use:["高血圧症","心不全などによる浮腫","腎性・肝性浮腫など"],

    serious:["強いアレルギー反応","重い血液障害","低カリウム血症に伴う重い不整脈","重い皮膚障害","腎障害・間質性肺炎","難聴"],
    caution:["利尿が強く出ると脱水・電解質異常につながるため注意が必要です。","連用時は電解質の定期確認が必要です。","夜間頻尿を避けるため、昼間の服用が望ましい場合があります。"],
    care:["尿量や排尿回数が急に増えすぎていないか","体重・むくみがどう変化しているか","口渇、皮膚や口腔の乾燥、食欲低下など脱水の兆候","ふらつき・立ちくらみ・転倒","筋けいれん、強いだるさ、ぼんやりするなど電解質異常を疑う変化"],
    updated:"2026年2月改訂版を参照",
    source:"https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/2139005F1117_1?user=1"
  },
  {
    id:"zolpidem",
    name:"ゾルピデム",
    generic:"ゾルピデム酒石酸塩",
    aliases:["ゾルピデム","マイスリー","zolpidem"],
    className:"睡眠薬",
    what:"寝つきをよくする睡眠薬です。服用後の眠気やふらつきが翌朝まで残ることがあります。",
    use:["不眠症（添付文書上、一部の精神疾患に伴う不眠症を除く）"],
    common:["ふらつき","眠気","翌朝の残眠感","めまい","頭痛","悪心","倦怠感","転倒"],
    serious:["依存・離脱症状","せん妄・錯乱・幻覚など","服薬後の健忘・もうろう状態・夢遊様行動","呼吸抑制"],
    caution:["就寝直前に服用し、服用後はすぐ就寝することが重要です。","翌朝も眠気や注意力低下が残ることがあります。","長期の漫然投与は避けるとされています。"],
    care:["翌朝の眠気・ぼんやり感が強くないか","夜間や起床時のふらつき・転倒","本人が覚えていない夜間行動や食事、外出などがないか","せん妄・混乱・幻覚など普段と違う精神状態","服薬時刻が就寝直前になっているか"],
    updated:"2026年2月改訂版を参照",
    source:"https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/1129009F1378_1?user=1"
  },
  {
    id:"edoxaban",
    name:"エドキサバン",
    generic:"エドキサバントシル酸塩水和物",
    aliases:["エドキサバン","リクシアナ","lixiana","edoxaban"],
    className:"経口FXa阻害薬（抗凝固薬）",
    what:"血液を固まりにくくして血栓を予防・治療する薬です。特に重要なのは『出血しやすくなる』点です。",

    serious:["消化管出血","頭蓋内出血","眼内出血などの重大な出血","急性腎障害","肝機能障害・黄疸","間質性肺疾患"],
    caution:["自己判断で中止しないことが重要です。","鼻血・歯肉出血・血尿・吐血・血便など異常な出血があれば医療職へ連絡する必要があります。","手術や侵襲的処置の前後は、必ず医師・歯科医師・薬剤師へ服用中であることを伝える薬です。"],
    care:["青あざや皮下出血が増えていないか","鼻血・歯肉出血が止まりにくくないか","血尿、黒い便、血便、吐血などがないか","転倒や頭部打撲がなかったか","服薬の自己中断や飲み忘れが増えていないか","受診・歯科治療・手術予定時に抗凝固薬服用が共有されているか"],
    updated:"2025年11月改訂版を参照",
    source:"https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/3339002F1020_1?user=1"
  },
  {
    id:"sennoside",
    name:"センノシド",
    generic:"センノシドA・Bカルシウム塩",
    aliases:["センノシド","プルゼニド","sennoside","senna"],
    className:"刺激性下剤（緩下剤）",
    what:"大腸の動きを促して排便を起こす便秘薬です。通常は服用後8〜10時間ほどで作用します。",
    use:["便秘症"],
    common:["腹痛","下痢","悪心・嘔吐","腹鳴","腹部不快感"],
    serious:["添付文書上『重大な副作用』の区分はありません。ただし、強い下痢に伴う脱水、低カリウム血症・低ナトリウム血症、血圧低下には注意が必要です。"],
    caution:["長期連用すると効きにくくなり、薬に頼りやすくなることがあるため、長期連用は避けるとされています。","急性腹症が疑われる場合など、使用できない状態があります。"],
    care:["排便回数・便の硬さがどう変わったか","腹痛や下痢が続いていないか","水分摂取、口渇、尿量など脱水の兆候","毎日長期間使い続ける状態になっていないか","強いだるさや筋力低下など電解質異常を疑う変化"],
    updated:"2026年6月改訂版を参照",
    source:"https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/2354003F2340_3?user=1"
  }
];

const main = document.getElementById("main");
const search = document.getElementById("search");
const clearBtn = document.getElementById("clear");

function normalize(s){
  return (s||"").toLowerCase().replace(/[ 　\-ー]/g,"");
}

function remember(name){
  let r = JSON.parse(localStorage.getItem("medRecent") || "[]");
  r = [name, ...r.filter(x=>x!==name)].slice(0,5);
  localStorage.setItem("medRecent", JSON.stringify(r));
}

function home(){
  const recent = JSON.parse(localStorage.getItem("medRecent") || "[]");
  main.innerHTML = `
    <div class="hint">一般名・商品名のどちらでも検索できます。まずは試作登録の5剤です。</div>
    <div class="section-title">すぐ試せる薬</div>
    <div class="chips">
      ${drugs.map(d=>`<button class="chip" data-name="${d.name}">${d.name}</button>`).join("")}
    </div>
    ${recent.length ? `
      <div class="section-title" style="margin-top:8px">最近見た薬</div>
      <div class="result-list">
        ${recent.map(n=>{
          const d=drugs.find(x=>x.name===n); if(!d) return "";
          return `<div class="result-item" data-id="${d.id}">
            <div><strong>${d.name}</strong><small>${d.className}</small></div><span class="arrow">›</span>
          </div>`;
        }).join("")}
      </div>` : `
      <div class="empty">
        薬名を入力すると、<br>
        <strong>「何の薬」「主な副作用」「観察ポイント」</strong><br>
        を優先して表示します。
      </div>`}
    <div class="disclaimer">
      <strong>試作版について：</strong><br>
      本ツールはケアマネジメント上の情報整理を補助する試作品です。診断、処方、服薬変更、中止等の判断には使用しないでください。実際の対応は医師・薬剤師等に確認し、最新の電子添文を参照してください。
    </div>
    <div class="foot-note">PWA v1.0</div>
  `;
  bindClickable();
}

function searchResults(q){
  const nq=normalize(q);
  if(!nq){home(); return;}
  const hits=drugs.filter(d =>
    d.aliases.some(a=>normalize(a).includes(nq) || nq.includes(normalize(a))) ||
    normalize(d.generic).includes(nq)
  );
  if(!hits.length){
    main.innerHTML = `
      <div class="empty">
        <strong>「${escapeHtml(q)}」は試作データに未登録です。</strong><br><br>
        現在は5剤だけ登録しています。<br>
        本番版ではここを大幅に増やす想定です。
      </div>`;
    return;
  }
  main.innerHTML = `
    <div class="section-title">検索結果 ${hits.length}件</div>
    <div class="result-list">
      ${hits.map(d=>`<div class="result-item" data-id="${d.id}">
        <div><strong>${d.name}</strong><small>${d.generic} ・ ${d.className}</small></div>
        <span class="arrow">›</span>
      </div>`).join("")}
    </div>`;
  bindClickable();
}

function showDrug(id){
  const d=drugs.find(x=>x.id===id);
  if(!d) return;
  remember(d.name);
  search.value=d.name;
  clearBtn.style.display="block";
  main.innerHTML = `
    <button class="back" id="backBtn">← 検索に戻る</button>
    <section class="drug-head">
      <div class="drug-name">${d.name}</div>
      <div class="generic">一般名・成分：${d.generic}</div>
      <span class="tag">${d.className}</span>
    </section>

    <div class="priority-grid">
      <section class="card primary">
        <h2><span class="num">1</span>何の薬か</h2>
        <p>${d.what}</p>
      </section>

      <section class="card warn">
        <h2><span class="num">3</span>主な副作用</h2>
        <ul>${d.common.map(x=>`<li>${x}</li>`).join("")}</ul>
      </section>

      <section class="card care">
        <h2><span class="num">6</span>ケアマネとして観察するなら</h2>
        <ul>${d.care.map(x=>`<li>${x}</li>`).join("")}</ul>
        <div class="important-note">「薬が原因」と決めつけるためではなく、変化に気づいて医療職へつなぐための観察ポイントです。</div>
      </section>
    </div>

    <div class="secondary">
      <details>
        <summary><span><span class="num">2</span>何に使われるか</span></summary>
        <div class="detail-body"><ul>${d.use.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </details>
      <details>
        <summary><span><span class="num">4</span>見逃したくない副作用</span></summary>
        <div class="detail-body"><ul>${d.serious.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </details>
      <details>
        <summary><span><span class="num">5</span>服薬上の主な注意</span></summary>
        <div class="detail-body"><ul>${d.caution.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </details>
    </div>

    <section class="source">
      <div class="source-title">情報源：PMDA 電子添文</div>
      <p>${d.updated}。この試作では情報をケアマネ向けに要約しています。</p>
      <a href="${d.source}" target="_blank" rel="noopener noreferrer">PMDAの公式情報を開く ↗</a>
    </section>

    <div class="disclaimer">
      <strong>重要：</strong><br>
      本ツールは薬剤情報の確認を補助するもので、診断・処方・服薬変更・中止を判断するものではありません。症状や服薬について懸念がある場合は、医師・薬剤師等へ確認してください。
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click",()=>{
    search.focus();
    searchResults(search.value);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function bindClickable(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    el.addEventListener("click",()=>showDrug(el.dataset.id));
  });
  document.querySelectorAll("[data-name]").forEach(el=>{
    el.addEventListener("click",()=>{
      search.value=el.dataset.name;
      clearBtn.style.display="block";
      const d=drugs.find(x=>x.name===el.dataset.name);
      if(d) showDrug(d.id);
    });
  });
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

search.addEventListener("input", e=>{
  clearBtn.style.display=e.target.value ? "block" : "none";
  searchResults(e.target.value);
});
search.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const q=normalize(search.value);
    const exact=drugs.find(d=>d.aliases.some(a=>normalize(a)===q) || normalize(d.generic)===q);
    if(exact) showDrug(exact.id);
  }
});
clearBtn.addEventListener("click",()=>{
  search.value="";
  clearBtn.style.display="none";
  search.focus();
  home();
});

home();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
